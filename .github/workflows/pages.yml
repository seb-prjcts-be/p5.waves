name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build static site artifact
        run: |
          mkdir -p _site
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "tests" \
            --exclude "src" \
            ./ _site/
          touch _site/.nojekyll

      # The committed manifest is regenerated by a local pre-commit hook, which
      # never runs for PRs merged on GitHub. Derive the drift-prone mechanical
      # fields (version, commit) from the library source at deploy time, so the
      # published manifest can never lag a release. Vanilla node, no deps.
      - name: Sync manifest version from library source
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("_site/p5.waves.js", "utf8");
            const m = src.match(/^\s*\*\s*Version\s+([0-9]+\.[0-9]+\.[0-9]+)/m);
            if (!m) { console.error("no Version header in p5.waves.js"); process.exit(1); }
            const p = "_site/docs/p5.waves.manifest.json";
            const man = JSON.parse(fs.readFileSync(p, "utf8"));
            man.version = m[1];
            man.commit = (process.env.GITHUB_SHA || "unknown").slice(0, 7);
            const next = JSON.stringify(man, null, 2) + "\n";
            if (fs.readFileSync(p, "utf8") === next) { console.log("manifest already matches source and deploy commit"); process.exit(0); }
            fs.writeFileSync(p, next);
            console.log("manifest synced: v" + m[1] + " " + man.commit);
          '

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
